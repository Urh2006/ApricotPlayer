[package]
name = "apricot-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
apricot-core.workspace = true
apricot-media.workspace = true
apricot-updater.workspace = true
chrono.workspace = true
encoding_rs.workspace = true
reqwest = { workspace = true, features = ["cookies"] }
flate2 = "1.1.10"
rand.workspace = true
regex = "1"
serde_json.workspace = true
serde.workspace = true
roxmltree.workspace = true
thiserror.workspace = true
tempfile = "3"
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
wasapi = "0.27"
souvlaki = { version = "0.9.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
objc2-foundation = "0.3.2"
screencapturekit = { version = "11.1.2", features = ["macos_15_0"] }
souvlaki = { version = "0.9.3", default-features = false }
sha2.workspace = true

[features]
# ApricotPlayer 2.0 in place of the Python version (same folders and names).
stable-identity = ["apricot-updater/stable-identity"]

[lints]
workspace = true
