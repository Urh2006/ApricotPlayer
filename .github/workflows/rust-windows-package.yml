name: Rust Windows package

# Builds the Windows installer and portable zip with
# rust/scripts/build_stable_release.ps1, the script of the local Windows
# releases, and keeps them as a workflow artifact. libmpv is the build that
# prepare_libmpv.ps1 pins, mpv.exe comes from the same release, and FFmpeg
# and Node.js follow release.yml. It never publishes a release.
on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Update channel for the package"
        type: choice
        options: [stable, beta]
        default: stable

permissions:
  contents: read

jobs:
  package:
    name: Windows package
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install the pinned toolchain
        working-directory: rust
        run: rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      - name: Download mpv and libmpv
        shell: pwsh
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept        = "application/vnd.github+json"
          }
          # shinchiro keeps only recent builds, so the libmpv that
          # prepare_libmpv.ps1 pins can no longer be downloaded. mpv.exe and
          # libmpv come from the same newest x86_64 build, checked against
          # their release digests; the real libmpv tests below qualify it.
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers $headers
          $player = $release.assets | Where-Object { $_.name -match '^mpv-x86_64-\d{8}-git-[0-9a-f]+\.7z$' } | Select-Object -First 1
          $dev = $release.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d{8}-git-[0-9a-f]+\.7z$' } | Select-Object -First 1
          foreach ($asset in @($player, $dev)) {
            if (-not $asset -or $asset.digest -notmatch '^sha256:[0-9a-f]{64}$') { throw "Could not find the mpv x86_64 release assets" }
          }
          New-Item -ItemType Directory -Force -Path vendor\mpv, rust\.cargo-local\libmpv | Out-Null
          foreach ($pair in @(@($player, "mpv.7z", "mpv_extracted"), @($dev, "libmpv.7z", "libmpv_extracted"))) {
            $asset, $file, $folder = $pair
            Write-Host "Downloading $($asset.name) ($($asset.digest))"
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $file
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ("sha256:$hash" -ne $asset.digest) { throw "$($asset.name) SHA-256 verification failed" }
            & "C:\Program Files\7-Zip\7z.exe" x $file -o"$folder" -y | Out-Null
          }
          foreach ($name in "mpv.exe", "d3dcompiler_43.dll") {
            $found = Get-ChildItem -Path mpv_extracted -Filter $name -Recurse | Select-Object -First 1
            if (-not $found) { throw "$name was not found in $($player.name)" }
            Copy-Item -LiteralPath $found.FullName -Destination vendor\mpv\ -Force
          }
          $dll = Get-ChildItem -Path libmpv_extracted -Filter "libmpv-2.dll" -Recurse | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll was not found in $($dev.name)" }
          Copy-Item -LiteralPath $dll.FullName -Destination rust\.cargo-local\libmpv\ -Force
          # The real libmpv tests find libmpv next to mpv.exe.
          New-Item -ItemType Directory -Force -Path qualify-mpv | Out-Null
          Copy-Item -Path vendor\mpv\*, $dll.FullName -Destination qualify-mpv\ -Force
          Get-ChildItem vendor\mpv, rust\.cargo-local\libmpv -Name
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the FFmpeg win64 GPL runtime
        shell: pwsh
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept        = "application/vnd.github+json"
          }
          # The build that release.yml locks, while BtbN still keeps it;
          # otherwise their current GPL build, checked against its digest.
          $expectedFfmpegHash = '8069a62dfec0b2f57a3f226695b94f4facf1102af517291e4bfd0e3db42df5dc'
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/autobuild-2026-07-10-13-44" -Headers $headers
            $asset = $release.assets | Where-Object { $_.name -eq 'ffmpeg-N-125515-g35f8f4bdc0-win64-gpl.zip' } | Select-Object -First 1
            if ($asset.digest -ne "sha256:$expectedFfmpegHash") { throw "FFmpeg release metadata digest changed" }
          }
          catch {
            Write-Host "The locked FFmpeg build is gone: $($_.Exception.Message)"
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest" -Headers $headers
            $asset = $release.assets | Where-Object { $_.name -eq 'ffmpeg-master-latest-win64-gpl.zip' } | Select-Object -First 1
            if (-not $asset -or $asset.digest -notmatch '^sha256:[0-9a-f]{64}$') { throw "Could not find the FFmpeg release asset" }
            $expectedFfmpegHash = $asset.digest.Substring(7)
          }
          Write-Host "Downloading ffmpeg asset: $($asset.name) (sha256:$expectedFfmpegHash)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile ffmpeg.zip
          $actualFfmpegHash = (Get-FileHash -LiteralPath ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualFfmpegHash -ne $expectedFfmpegHash) { throw "ffmpeg SHA-256 verification failed" }
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted -Force
          $ffmpegExe = Get-ChildItem -Path ffmpeg_extracted -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          if (-not $ffmpegExe) { throw "ffmpeg.exe not found in archive" }
          New-Item -ItemType Directory -Force -Path vendor\ffmpeg | Out-Null
          Copy-Item -Path $ffmpegExe.FullName -Destination vendor\ffmpeg\ffmpeg.exe -Force
          Write-Host "ffmpeg.exe placed in vendor\ffmpeg"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download locked Node.js LTS runtime
        shell: pwsh
        run: |
          $nodeVersion = '24.18.0'
          $expectedNodeHash = '9A4EB5F1C29C6A2E93852EAD46B999E284A6A5CA8BAB4D4E241D587D025A52DE'
          New-Item -ItemType Directory -Force -Path vendor\node | Out-Null
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$nodeVersion/win-x64/node.exe" -OutFile vendor\node\node.exe
          $actualNodeHash = (Get-FileHash -LiteralPath vendor\node\node.exe -Algorithm SHA256).Hash
          if ($actualNodeHash -ne $expectedNodeHash) { throw "Node.js SHA-256 verification failed" }
          $signature = Get-AuthenticodeSignature -LiteralPath vendor\node\node.exe
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Node.js Authenticode verification failed"
          }
          & vendor\node\node.exe --version

      - name: Qualify real playback
        working-directory: rust
        shell: pwsh
        run: |
          $env:APRICOT_TEST_MPV = (Resolve-Path ..\qualify-mpv\mpv.exe).Path
          $env:APRICOT_TEST_FFMPEG = (Resolve-Path ..\vendor\ffmpeg\ffmpeg.exe).Path
          cargo test -p apricot-playback real_libmpv --locked -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "The real libmpv tests failed" }

      - name: Install Inno Setup 6
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Build the installer and the portable zip
        shell: pwsh
        env:
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: |
          $Channel = if ($env:RELEASE_CHANNEL) { $env:RELEASE_CHANNEL } else { "stable" }
          .\rust\scripts\build_stable_release.ps1 -Channel $Channel

      - name: Verify the portable package
        shell: pwsh
        run: |
          $Release = Get-ChildItem rust\local-dist\stable -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $Verify = Join-Path $env:RUNNER_TEMP "apricot-verify"
          Expand-Archive -LiteralPath (Join-Path $Release.FullName "ApricotPlayer.zip") -DestinationPath $Verify -Force
          $Exe = Join-Path $Verify "ApricotPlayer\ApricotPlayer.exe"
          foreach ($Check in "--qualification-smoke", "--qualification-ytdlp", "--qualification-youtube-helper", "--qualification-playback") {
            $Run = Start-Process -FilePath $Exe -ArgumentList $Check -Wait -PassThru -WindowStyle Hidden
            if ($Run.ExitCode -ne 0) { throw "$Check failed with exit code $($Run.ExitCode)" }
            Write-Host "$Check passed"
          }
          Get-Content (Join-Path $Release.FullName "SHA256SUMS.txt")

      - name: Keep the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apricotplayer-windows-x64
          path: |
            rust/local-dist/stable/*/ApricotPlayerSetup.exe
            rust/local-dist/stable/*/ApricotPlayer.zip
            rust/local-dist/stable/*/SHA256SUMS.txt
          if-no-files-found: error
