name: Release

on:
  # Automatic tag releases are disabled for now because GitHub-hosted runners
  # currently fail checkout with HTTP 403 before the build starts. Releases are
  # still created from local builds and can be run manually here if needed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.9.49)"
        required: true
        type: string

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.name }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve tag name
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$REQUESTED_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-(alpha|beta|rc)(\.[0-9]+)?)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: python
        run: |
          import re, os, sys

          tag = os.environ["TAG_NAME"]
          version = tag.lstrip("v")

          changelog = open("CHANGELOG.md", encoding="utf-8").read()

          pattern = rf"(^#\s+v{re.escape(version)}\b.*?)(?=^#\s+v|\Z)"
          match = re.search(pattern, changelog, re.MULTILINE | re.DOTALL)

          if match:
              body = match.group(1).strip()
          else:
              body = f"Release {tag}"

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(body)

          print(f"Extracted {len(body)} chars for {tag}")
        env:
          TAG_NAME: ${{ steps.tag.outputs.name }}

      - name: Determine pre-release flag
        id: prerelease
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          TAG="$RELEASE_TAG"
          if [[ "$TAG" == *"-beta"* || "$TAG" == *"-alpha"* || "$TAG" == *"-rc"* ]]; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
          PRERELEASE_FLAG: ${{ steps.prerelease.outputs.flag }}
        run: |
          TAG="$RELEASE_TAG"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists — updating notes only"
            gh release edit "$TAG" \
              --title "ApricotPlayer $TAG" \
              --notes-file release_notes.md
          else
            gh release create "$TAG" \
              --title "ApricotPlayer $TAG" \
              --notes-file release_notes.md \
              $PRERELEASE_FLAG
          fi

  build:
    name: Build Windows Installer and Portable ZIP
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Resolve tag name
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        run: |
          echo "name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release.outputs.release_tag }}

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies and PyInstaller
        run: pip install -r requirements-build.txt

      - name: Download locked mpv x86_64 runtime
        shell: pwsh
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept        = "application/vnd.github+json"
          }
          $expectedMpvHash = 'FACAC536BAA73C7B925771AF5E39A3C9CB16B8D75B59A6E9800DE89799DFFCA7'
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/tags/20260610" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -eq 'mpv-x86_64-20260610-git-304426c.7z' } | Select-Object -First 1
          if (-not $asset) { throw "Could not find the locked mpv x86_64 release asset" }
          Write-Host "Downloading mpv asset: $($asset.name)"
          if ($asset.digest -ne "sha256:$($expectedMpvHash.ToLowerInvariant())") { throw "mpv release metadata digest changed" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv.7z
          $actualMpvHash = (Get-FileHash -LiteralPath mpv.7z -Algorithm SHA256).Hash
          if ($actualMpvHash -ne $expectedMpvHash) { throw "mpv SHA-256 verification failed" }

          Write-Host "Extracting mpv archive..."
          & "C:\Program Files\7-Zip\7z.exe" x mpv.7z -o"mpv_extracted" -y | Out-Null

          # Robustly find mpv.exe regardless of archive structure
          # (some shinchiro builds are flat, some have a root wrapper directory)
          $mpvExe = Get-ChildItem -Path mpv_extracted -Filter "mpv.exe" -Recurse | Select-Object -First 1
          if (-not $mpvExe) {
            Write-Host "Archive contents:"
            Get-ChildItem mpv_extracted -Recurse | Select-Object FullName
            throw "mpv.exe was not found anywhere in the extracted archive"
          }
          Write-Host "Found mpv.exe at: $($mpvExe.FullName)"

          # Copy mpv.exe and all sibling files (required DLLs) to vendor\mpv
          New-Item -ItemType Directory -Force -Path vendor\mpv | Out-Null
          Get-ChildItem -Path $mpvExe.Directory.FullName -File |
            Copy-Item -Destination vendor\mpv\ -Force

          Write-Host "mpv installed. Files in vendor\mpv:"
          Get-ChildItem vendor\mpv -Name
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download locked FFmpeg win64 GPL runtime
        shell: pwsh
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept        = "application/vnd.github+json"
          }
          $expectedFfmpegHash = '8069A62DFEC0B2F57A3F226695B94F4FACF1102AF517291E4BFD0E3DB42DF5DC'
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/autobuild-2026-07-10-13-44" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -eq 'ffmpeg-N-125515-g35f8f4bdc0-win64-gpl.zip' } | Select-Object -First 1
          if (-not $asset) { throw "Could not find the locked FFmpeg release asset" }
          Write-Host "Downloading ffmpeg asset: $($asset.name)"
          if ($asset.digest -ne "sha256:$($expectedFfmpegHash.ToLowerInvariant())") { throw "FFmpeg release metadata digest changed" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile ffmpeg.zip
          $actualFfmpegHash = (Get-FileHash -LiteralPath ffmpeg.zip -Algorithm SHA256).Hash
          if ($actualFfmpegHash -ne $expectedFfmpegHash) { throw "ffmpeg SHA-256 verification failed" }
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted -Force
          $ffmpegExe = Get-ChildItem -Path ffmpeg_extracted -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          if (-not $ffmpegExe) { throw "ffmpeg.exe not found in archive" }
          New-Item -ItemType Directory -Force -Path vendor\ffmpeg | Out-Null
          Copy-Item -Path $ffmpegExe.FullName -Destination vendor\ffmpeg\ffmpeg.exe -Force
          Write-Host "ffmpeg.exe placed in vendor\ffmpeg"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download locked Node.js LTS runtime
        shell: pwsh
        run: |
          $nodeVersion = '24.18.0'
          $expectedNodeHash = '9A4EB5F1C29C6A2E93852EAD46B999E284A6A5CA8BAB4D4E241D587D025A52DE'
          New-Item -ItemType Directory -Force -Path vendor\node | Out-Null
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$nodeVersion/win-x64/node.exe" -OutFile vendor\node\node.exe
          $actualNodeHash = (Get-FileHash -LiteralPath vendor\node\node.exe -Algorithm SHA256).Hash
          if ($actualNodeHash -ne $expectedNodeHash) { throw "Node.js SHA-256 verification failed" }
          $signature = Get-AuthenticodeSignature -LiteralPath vendor\node\node.exe
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Node.js Authenticode verification failed"
          }
          & vendor\node\node.exe --version

      - name: Install Inno Setup 6
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Build installer and portable ZIP
        shell: pwsh
        run: .\scripts\build_release.ps1

      - name: Upload assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          gh release upload "$env:RELEASE_TAG" `
            release-dist\ApricotPlayerSetup.exe `
            release-dist\ApricotPlayer.zip `
            --clobber
