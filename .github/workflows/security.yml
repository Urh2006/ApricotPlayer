name: Security checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - beta
    paths:
      - "apricot/**"
      - "tests/**"
      - "scripts/**"
      - "wx_main.py"
      - "requirements*.txt"
      - ".github/workflows/**"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: Dependency and regression audit
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked audit environment
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Audit dependencies
        run: pip-audit --strict -r requirements-build.txt

      - name: Check critical Python errors
        run: ruff check apricot wx_main.py tests scripts/zip_folder.py --select E9,F63,F7,F82,F811,E402

      - name: Run security regression tests
        run: python -m unittest discover -s tests -v
